<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0d0221"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#00cc00"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Glow -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#39FF14" stroke-width="2" opacity="0.2"/>
  <!-- Q letter -->
  <text x="220" y="340" font-family="Arial Black, sans-serif" font-size="320" font-weight="900" fill="url(#green)">Q</text>
  <!-- Fart cloud -->
  <g transform="translate(360, 120)" opacity="0.9">
    <ellipse cx="0" cy="0" rx="45" ry="30" fill="#7B2FBE" opacity="0.7"/>
    <ellipse cx="30" cy="-15" rx="35" ry="25" fill="#9B4FDE" opacity="0.6"/>
    <ellipse cx="-20" cy="10" rx="25" ry="18" fill="#6B1FAE" opacity="0.5"/>
  </g>
  <!-- Small fart puffs -->
  <circle cx="420" cy="80" r="12" fill="#7B2FBE" opacity="0.4"/>
  <circle cx="440" cy="60" r="8" fill="#9B4FDE" opacity="0.3"/>
</svg>
